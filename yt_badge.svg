<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 44" width="185" height="44">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@700&amp;display=swap');
      .yt-badge-text {
        font-family: 'Roboto', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 32px;
        fill: #FF0000;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>
  <!-- Red YouTube Text in Roboto Bold -->
